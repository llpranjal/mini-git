[package]
name = "mini-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "A minimal, byte-compatible reimplementation of Git's object database and porcelain."

# Two binaries share one library so that integration tests and the benchmark can
# call the same code the CLI calls, instead of re-implementing it.
[lib]
name = "mini_git"
path = "src/lib.rs"

[[bin]]
name = "mgit"
path = "src/main.rs"

[[bin]]
name = "mgit-bench"
path = "bench/main.rs"

# Keep the pinned dependency versions compatible with the Rust 1.84 target.
# Tests use the local scratch-directory helper in src/scratch.rs.
[dependencies]
sha1 = "=0.10.6"    # SHA-1 digest. Git names objects by SHA-1; hand-rolling a
                    # hash function would be a correctness liability, not a lesson.
flate2 = "=1.0.35"  # zlib (RFC 1950) deflate/inflate. Git's loose object files
                    # are zlib streams, so this must match to interoperate.
clap = { version = "=4.5.23", features = ["derive"] } # Argument parsing only.
anyhow = "=1.0.95"  # Error type with context chaining, so failures print a path.

[profile.release]
opt-level = 3
